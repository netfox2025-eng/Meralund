herename: HG Scraper Engine via GitHub Actions

on:
  schedule:
    - cron: '0 * * * *' # Har ghante automatic chalega
  workflow_dispatch: # Manual run button

jobs:
  run-hf-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFMPEG (Required for Sample Clipping)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies & Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests huggingface_hub telethon cryptg
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Download Files From Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "📥 Downloading scripts and database via HuggingFace API..."
        python -c "
        import os
        from huggingface_hub import hf_hub_download
        token = os.environ.get('HF_TOKEN', '').strip()
        if not token:
            print('❌ HF_TOKEN Secret is Missing in GitHub!')
            exit(1)
        
        files = ['auto_scraper.py', 'posted_movies.txt', 'page_tracker.txt']
        for f in files:
            try:
                hf_hub_download(repo_id='Sudarshan143/Scrapper2', filename=f, repo_type='space', local_dir='.', token=token)
                print(f'✅ Successfully downloaded: {f}')
            except Exception as e:
                print(f'⚠️ Note on {f}: {e}')
        "

    - name: Run Smart Splitter Scraper
      run: |
        if [ -f "auto_scraper.py" ]; then
          python auto_scraper.py
        else
          echo "❌ auto_scraper.py file local workspace me nahi mili!"
          exit 1
        fi

    - name: Upload Updated Database Back to Hugging Face Space
      if: always()
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "📤 Syncing database files back to Hugging Face..."
        python -c "
        import os
        from huggingface_hub import HfApi
        token = os.environ.get('HF_TOKEN', '').strip()
        if not token:
            print('❌ HF_TOKEN Secret is Missing.')
            exit(0)
            
        api = HfApi(token=token)
        for f in ['posted_movies.txt', 'page_tracker.txt']:
            if os.path.exists(f):
                try:
                    api.upload_file(path_or_fileobj=f, path_in_repo=f, repo_id='Sudarshan143/Scrapper2', repo_type='space')
                    print(f'✅ Successfully synced {f} to HF Space!')
                except Exception as e:
                    print(f'❌ Upload failed for {f}: {e}')
        "
