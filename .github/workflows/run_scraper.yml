name: HG Scraper Engine

on:
  schedule:
    - cron: '0 * * * *' # Har ghante automatic chalega
  workflow_dispatch: # Manual run button

jobs:
  run-scraper-job:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Job ko 6 ghante se pehle band hone se bachane ke liye

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Dependency caching enabled for speed

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgbm-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests huggingface_hub telethon aiohttp aiofiles
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Download Database and Script from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import hf_hub_download
          files = ['auto_scraper.py', 'posted_movies.txt', 'page_tracker.txt']
          for f in files:
              try:
                  hf_hub_download(
                      repo_id='Sudarshan143/Scrapper2', 
                      filename=f, 
                      repo_type='space', 
                      local_dir='.', 
                      local_dir_use_symlinks=False, 
                      token=os.environ.get('HF_TOKEN')
                  )
                  print(f'✅ Downloaded: {f}')
              except Exception as e:
                  print(f'⚠️ Note on {f}: {e}')
          "

      - name: Run Main Scraper Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: 30022842
          API_HASH: "81cb9516a563932a13dc973d517e8a88"
        run: |
          # Script ko run karein
          python auto_scraper.py

      - name: Upload Updated Database to HuggingFace
        if: always() # Script crash ho ya success, DB update honi chahiye
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ.get('HF_TOKEN'))
          for f in ['posted_movies.txt', 'page_tracker.txt']:
              if os.path.exists(f):
                  try:
                      api.upload_file(path_or_fileobj=f, path_in_repo=f, repo_id='Sudarshan143/Scrapper2', repo_type='space')
                      print(f'✅ Synced {f} to HF Space!')
                  except Exception as e:
                      print(f'❌ Upload failed for {f}: {e}')
          "

